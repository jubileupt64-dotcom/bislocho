
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOSHI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;

    background:
        radial-gradient(ellipse at 15% 20%, #c49a35 0%, transparent 55%),
        radial-gradient(ellipse at 85% 75%, #a77b45 0%, transparent 55%),
        linear-gradient(130deg, #17120b, #72502c, #080808);
    background-size: 200% 200%;
    animation: backgroundMove 12s ease infinite alternate;
}

@keyframes backgroundMove {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
}

h1 {
    font-size: clamp(65px, 12vw, 110px);
    margin: 0 0 35px;
    font-weight: 900;
    letter-spacing: 8px;

    background: linear-gradient(
        90deg,
        #e6b83f 0%,
        #d5a84a 50%,
        #a87943 50%,
        #c99a60 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(3px 5px 8px #000);
}

.dog {
    width: 100px;
    height: 80px;
    margin-bottom: 10px;
    filter: drop-shadow(2px 5px 5px #000);
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 850px;
}

button {
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 17px;
    padding: 16px 24px;
    transition: 0.25s;
    box-shadow: 0 6px 15px #0008;
}

button:hover {
    transform: translateY(-6px) scale(1.06);
    filter: brightness(1.2);
}

button:active {
    transform: scale(0.94);
}

.pum {
    background: #080808;
    border-radius: 12px;
}

.coco {
    background: #174c24;
    border-radius: 50px;
}

.xixi {
    background: #dfff00;
    color: #202000;
    border-radius: 45% 55% 60% 40%;
}

.amor {
    background: #e94b72;
    border-radius: 15px 15px 15px 0;
}

.message {
    margin-top: 35px;
    min-height: 90px;
    max-width: 700px;
    padding: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
    color: #fff1c9;
    text-shadow: 2px 2px 5px black;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<div class="container">

    <!-- Silhueta de Yorkshire -->
    <svg class="dog" viewBox="0 0 120 90"
         xmlns="http://www.w3.org/2000/svg">
        <path fill="#17100a" d="
        M22 42
        L8 7
        Q5 0 18 8
        L43 27
        Q60 16 77 27
        L103 8
        Q116 0 112 12
        L99 47
        Q108 75 82 83
        Q60 95 37 82
        Q12 73 22 42 Z"/>
        <ellipse cx="43" cy="49" rx="5" ry="6" fill="#d6ad51"/>
        <ellipse cx="77" cy="49" rx="5" ry="6" fill="#d6ad51"/>
        <path d="M53 64 Q60 57 67 64 Q60 75 53 64"
              fill="#d6ad51"/>
    </svg>

    <h1>YOSHI</h1>

    <div class="buttons">

        <button class="amor" onclick="showMessage('amor')">
            ♥ AMOR
        </button>

        <button class="pum" onclick="showMessage('pum')">
            PUM
        </button>

        <button class="coco" onclick="showMessage('coco')">
            💩 COCO
        </button>

        <button class="xixi" onclick="showMessage('xixi')">
            💧 XIXI
        </button>

    </div>

    <div id="message" class="message hidden"></div>

</div>

<script>

function showMessage(type) {

    const message = document.getElementById("message");

    const messages = {

        pum: "o bislocho fez coco",

        coco: "O COCO DO YOSHI SAIU DEPOIS DE 2 MINUTOS DE ESFORÇO, TEM UMA COR CASTANHO CARAMELO E MEDE 4CM DE COMPRIMENTO E 2CM DE DIÂMETRO",

        xixi: "a fralda do yoshi ta com xixi, está na tua hora mãe",

        amor: "está na hora do amor pai, e não há nada que possas fazer porque senão vais magoar os sentimentos do yoshi"

    };

    message.textContent = messages[type];

    message.classList.remove("hidden");

}

</script>

</body>
</html>
